spring.application.name=uniescola


# ============================================
# CONFIGURAÇÕES DO SERVIDOR
# ============================================
server.port=8080

# ============================================
# CONFIGURAÇÕES DO SPRING APPLICATION
# ============================================
spring.application.name=uniescola

# ============================================
# CONFIGURAÇÕES DO BANCO DE DADOS (MySQL)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/ryan?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================
# CONFIGURATION PROPERTIES CUSTOMIZADA
# ============================================
uniescola.config.nome-sistema=UniEscola API
uniescola.config.versao=1.0.0
uniescola.config.max-alunos-turma=40
uniescola.config.ambiente=desenvolvimento

# ============================================
# LOGGING
# ============================================
logging.level.com.unipiagte.uniescola=DEBUG
logging.level.org.hibernate.SQL=DEBUG